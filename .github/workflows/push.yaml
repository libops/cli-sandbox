name: build
on:
  push:
jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: shellcheck *.sh scripts/*.sh
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          verbose: true
  push:
    needs: [lint]
    uses: libops/.github/.github/workflows/build-push.yaml@3ef8469c16c40842cc1b0b9195df2850ad8e616f # main
    permissions:
      contents: read
      packages: write
    secrets: inherit
  push-cli:
    needs: [push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        cli: [claude, codex, gemini, opencode, pi]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          platforms: linux/amd64,linux/arm64
          build-args: CLI=${{ matrix.cli }}
          tags: ghcr.io/libops/cli-sandbox:${{ matrix.cli }}
          push: true
          cache-from: |
            type=registry,ref=ghcr.io/libops/cli-sandbox:cache-${{ matrix.cli }}
            type=registry,ref=ghcr.io/libops/cli-sandbox:cache-amd64
            type=registry,ref=ghcr.io/libops/cli-sandbox:cache-arm64
          cache-to: type=registry,ref=ghcr.io/libops/cli-sandbox:cache-${{ matrix.cli }},mode=max
