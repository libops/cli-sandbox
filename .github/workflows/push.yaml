name: build
on:
  push:
jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: shellcheck *.sh scripts/*.sh
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          verbose: true
  push:
    needs: [lint]
    uses: libops/.github/.github/workflows/build-push.yaml@782ba8f6514788269e93e0a51c001061279f645a # main
    permissions:
      contents: read
      packages: write
    secrets: inherit
  push-cli:
    needs: [push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        cli: [claude, codex, gemini, opencode, pi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          platforms: linux/amd64,linux/arm64
          build-args: CLI=${{ matrix.cli }}
          tags: ghcr.io/libops/cli-sandbox:${{ matrix.cli }}
          push: true
          cache-from: |
            type=registry,ref=ghcr.io/libops/cli-sandbox:cache-${{ matrix.cli }}
            type=registry,ref=ghcr.io/libops/cli-sandbox:cache-amd64
            type=registry,ref=ghcr.io/libops/cli-sandbox:cache-arm64
          cache-to: type=registry,ref=ghcr.io/libops/cli-sandbox:cache-${{ matrix.cli }},mode=max
