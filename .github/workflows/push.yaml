name: build
on:
  push:
jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: shellcheck *.sh scripts/*.sh
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          verbose: true
  push:
    needs: [lint]
    uses: libops/.github/.github/workflows/build-push.yaml@d7f0ba06b4c8a1f8559892ea65a0b1af4d024dd3 # main
    permissions:
      contents: read
      packages: write
    secrets: inherit
  push-cli:
    needs: [push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        cli: [claude, codex, gemini, opencode, pi]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          platforms: linux/amd64,linux/arm64
          build-args: CLI=${{ matrix.cli }}
          tags: ghcr.io/libops/cli-sandbox:${{ matrix.cli }}
          push: true
          cache-from: |
            type=registry,ref=ghcr.io/libops/cli-sandbox:cache-${{ matrix.cli }}
            type=registry,ref=ghcr.io/libops/cli-sandbox:cache-amd64
            type=registry,ref=ghcr.io/libops/cli-sandbox:cache-arm64
          cache-to: type=registry,ref=ghcr.io/libops/cli-sandbox:cache-${{ matrix.cli }},mode=max
